# Latency Alerts (histogram-based, RED method)
#
# p99 latency alerts computed with histogram_quantile over
# http_request_duration_seconds_bucket — the Duration leg of RED.
# Histogram quantiles are estimable and aggregatable; never alert on
# precomputed client-side percentiles (they don't aggregate across pods).
#
# Two severities:
#   - critical (page): p99 > 2s for 10m — users are feeling it.
#   - warning (ticket): p99 > 1s for 30m, or p95 > 800ms — degrading.
#
# Thresholds assume an SLO of p99 < 1s over 30d; the critical line is set at
# 2x the SLO target so the page means "SLO is actually breached," and the
# warning line at the SLO target itself so the team sees drift early.
# Tune both to your own latency SLI (see sre-runbooks/sli-slo).

groups:
  - name: latency.rules
    interval: 1m
    rules:
      # Recording rules: reusable quantiles per service. Computing these once
      # keeps every alert and dashboard panel consistent.
      - record: job:http_request_duration_seconds:p99_5m
        expr: |
          histogram_quantile(0.99,
            sum by (namespace, service, le) (
              rate(http_request_duration_seconds_bucket{namespace="payments", service="checkout-api"}[5m])
            )
          )

      - record: job:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (namespace, service, le) (
              rate(http_request_duration_seconds_bucket{namespace="payments", service="checkout-api"}[5m])
            )
          )

      - record: job:http_request_duration_seconds:p50_5m
        expr: |
          histogram_quantile(0.50,
            sum by (namespace, service, le) (
              rate(http_request_duration_seconds_bucket{namespace="payments", service="checkout-api"}[5m])
            )
          )

      # Page: p99 above 2s sustained 10m. GC pause, downstream stall, or a
      # bad deploy — either way users notice at p99.
      - alert: HighLatencyP99
        expr: |
          job:http_request_duration_seconds:p99_5m{namespace="payments", service="checkout-api"} > 2
        for: 10m
        labels:
          severity: critical
          tier: page
        annotations:
          summary: "p99 latency above 2s on {{ $labels.service }}"
          description: |
            p99 request latency has exceeded 2s for 10 minutes
            (SLO target: p99 < 1s). Check downstream dependencies,
            database slow-query log, and recent deploys. Compare p50 vs p99:
            if p50 is fine and p99 is bad, it's a tail problem (GC, retries,
            a slow shard) — not a capacity problem.
            Current p99: {{ $value | humanizeDuration }}.
          runbook_url: "https://github.com/shaunnstjohn/sre-runbooks/blob/main/runbooks/k8s-crashloopbackoff.md"

      # Ticket: p99 drifting above the 1s SLO target for 30m. Early warning —
      # fix before it becomes the page above.
      - alert: LatencySloAtRisk
        expr: |
          job:http_request_duration_seconds:p99_5m{namespace="payments", service="checkout-api"} > 1
        for: 30m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "p99 latency above 1s SLO target on {{ $labels.service }}"
          description: |
            p99 latency above the 1s SLO target for 30 minutes. Not paging
            yet, but the error budget for the latency SLI is burning.
            Review the RED dashboard Duration panels and recent changes.
            Current p99: {{ $value | humanizeDuration }}.
          runbook_url: "https://github.com/shaunnstjohn/sre-runbooks/blob/main/sli-slo/slo-worked-examples.md"

      # Ticket: p95 above 800ms — catches broad-based slowdowns that p99
      # alone can mask when only a thin tail is bad.
      - alert: ElevatedLatencyP95
        expr: |
          job:http_request_duration_seconds:p95_5m{namespace="payments", service="checkout-api"} > 0.8
        for: 30m
        labels:
          severity: warning
          tier: ticket
        annotations:
          summary: "p95 latency above 800ms on {{ $labels.service }}"
          description: |
            p95 latency above 800ms for 30 minutes — a broad slowdown, not
            just a tail. Suspect dependency latency, connection pool
            exhaustion, or CPU throttling on the pods.
            Current p95: {{ $value | humanizeDuration }}.
          runbook_url: "https://github.com/shaunnstjohn/sre-runbooks/blob/main/runbooks/linux-high-cpu.md"
